<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" id="meta-cs" content="light dark">
<meta name="darkreader-lock">
<title>SDR Command Center Lite</title>
<meta name="generator" content="SDR Command Center Lite 1.8.0 – optimised for Team plans – built by Csaba Fehér">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem("sdrlite_theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);document.getElementById("meta-cs").setAttribute("content","only "+t);}}catch(e){}})();
</script>
<style>
:root{
  --paper:#EDF1F2;--sheet:#FFFFFF;--ink:#172231;--muted:#5C6A76;--rule:#D4DBDF;--soft:#E4EAEC;--hover:#F4F7F8;
  --go:#0E7C66;--go-ink:#FFFFFF;--go-soft:#DCEFEA;
  --gold:#D99A00;--gold-soft:#FBF0D2;
  --brick:#C24A33;--brick-soft:#F8E3DE;
  --sky:#3567D6;--sky-soft:#E1E9FA;
  --slate:#9AA6B1;--slate2:#6F7E8C;--violet:#7A62C9;--violet-soft:#ECE7F8;
  --tick:#D3DBDF;
  --font:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
:root[data-theme="light"]{color-scheme:only light}
:root[data-theme="dark"]{color-scheme:only dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E151B;--sheet:#16212A;--ink:#E5ECF0;--muted:#99A8B4;--rule:#283540;--soft:#1D2A34;--hover:#1A2630;
  --go:#2FB592;--go-ink:#06231C;--go-soft:#163A31;--gold:#F0C232;--gold-soft:#3A3014;--brick:#E2735D;--brick-soft:#3D1F19;
  --sky:#7096F0;--sky-soft:#1C2C4D;--slate:#5E6D7A;--slate2:#8494A2;--violet:#A592E8;--violet-soft:#2B2547;--tick:#26333D}}
:root[data-theme="dark"]{
  --paper:#0E151B;--sheet:#16212A;--ink:#E5ECF0;--muted:#99A8B4;--rule:#283540;--soft:#1D2A34;--hover:#1A2630;
  --go:#2FB592;--go-ink:#06231C;--go-soft:#163A31;--gold:#F0C232;--gold-soft:#3A3014;--brick:#E2735D;--brick-soft:#3D1F19;
  --sky:#7096F0;--sky-soft:#1C2C4D;--slate:#5E6D7A;--slate2:#8494A2;--violet:#A592E8;--violet-soft:#2B2547;--tick:#26333D}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--sky)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;line-height:1.2}
button:hover{background:var(--hover)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--go);border-color:var(--go);color:var(--go-ink);font-weight:600}
button.primary:hover{filter:brightness(1.06);background:var(--go)}
button.quiet{border-color:transparent;background:transparent}
button.quiet:hover{background:var(--soft)}
button.sm{padding:5px 9px;font-size:12px;border-radius:8px}
button.danger{color:var(--brick)}
button.danger.armed{background:var(--brick);border-color:var(--brick);color:#fff}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=datetime-local],textarea{
  border:1px solid var(--rule);border-radius:8px;padding:7px 9px;background:var(--sheet);font-size:13px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical;line-height:1.45}
@media (max-width:640px){select,input,textarea,button{font-size:16px}}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.wrap{max-width:1320px;margin:0 auto;padding:18px 22px 64px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:11px;background:var(--go);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;fill:var(--go-ink)}
h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.sub1{color:var(--muted);font-size:12.5px;margin-top:1px}
.tools{display:flex;gap:6px;align-items:center}
.setupchip{display:inline-flex;align-items:center;gap:6px}
.setupchip .dotp{width:7px;height:7px;border-radius:50%;background:var(--gold)}

.banner{margin-top:12px;border-radius:10px;padding:9px 12px;font-size:13px;background:var(--gold-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner:empty{display:none}

/* today strip: the tally */
.strip{margin-top:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(200px,auto) 1fr;gap:10px 26px;align-items:start}
@media (max-width:820px){.strip{grid-template-columns:1fr}}
.tally .big{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1}
.tally .big small{font-size:18px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.tally .cap{font-size:13px;color:var(--muted);margin-top:4px}
.strip.slim{display:block;padding:8px 14px;border-radius:12px;margin-top:12px}
.strip.slim .sl{display:flex;align-items:center;gap:14px;min-width:0}
.strip.slim .sn{font-size:22px;font-weight:800;letter-spacing:-.02em}
.strip.slim .ticks.mini{flex:1;flex-wrap:nowrap;overflow:hidden;padding:0;min-width:40px}
.strip.slim .ticks.mini i{height:14px;flex:none}
.strip.slim .ss{font-size:12px;color:var(--muted);white-space:nowrap}.strip.slim .ss b{color:var(--ink);font-weight:700}.strip.slim .ss.due b{color:var(--brick)}
@media (max-width:640px){.strip.slim .ticks.mini{display:none}.strip.slim .ss:nth-of-type(2),.strip.slim .ss:nth-of-type(3){display:none}}
.qlog{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 2px 38px;padding:8px 10px;border-radius:10px;background:var(--go-soft)}
.qlog button{padding:6px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}.qlog button i{width:4px;height:13px;border-radius:2px}
@media (max-width:980px){.qlog{margin-left:0}}
@media (max-width:760px){.focus.stickyout .fo-out{position:sticky;bottom:-24px;background:var(--sheet);padding:10px 0 12px;border-top:1px solid var(--rule);z-index:3;box-shadow:0 -10px 18px -12px rgba(0,0,0,.35)}
 .focus.stickyout .fo-out .outs{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px}.focus.stickyout .fo-out h4,.focus.stickyout .fo-out p.tiny,.focus.stickyout .fo-out kbd{display:none}
 .focus.stickyout .fo-out .outs button{padding:7px 7px;font-size:12px;gap:5px}}
.quick{background:var(--go-soft);border-color:transparent}
.demobar{margin-top:12px;border-radius:12px;padding:10px 14px;background:var(--violet-soft);border:1px solid var(--violet);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
.welcome{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.welcome .wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:760px){.wopts{grid-template-columns:1fr}}
.wopt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.wopt:hover{border-color:var(--go);background:var(--go-soft)}
.wopt b{font-size:14px}.wopt span:not(.wi){font-size:12px;color:var(--muted);font-weight:400;line-height:1.4}
.wi{font-size:18px;line-height:1}
.ticks{display:flex;flex-wrap:wrap;gap:3px 0;align-content:flex-start;padding-top:4px}
.ticks i{display:block;width:var(--tw,5px);height:24px;border-radius:2px;background:var(--tick);margin-right:var(--tg,3px)}
.ticks i.g10{margin-right:calc(var(--tg,3px) + 8px)}
.ticks i.na{background:var(--slate)}.ticks i.gk{background:var(--slate2)}.ticks i.x{background:var(--slate)}
.ticks i.cb,.ticks i.lost{background:var(--go)}.ticks i.meet{background:var(--gold);height:22px;box-shadow:0 0 0 1px var(--gold)}
.ticks i.bad{background:var(--brick)}
.ticks i.over{opacity:.9}
.ticks i.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scaleY(1.9)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){.ticks i.pop{animation:none}}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.stat b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.due b{color:var(--brick)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:5px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);margin-top:14px;padding:8px 0;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--paper)}
.nav button{border:0;background:transparent;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.nav button.on{color:var(--ink);background:var(--sheet);box-shadow:inset 0 -2px 0 var(--go)}
.nav .n{font-weight:500;color:var(--muted);margin-left:5px;font-size:12px}
.view{display:none;margin-top:16px}.view.on{display:block}

/* generic */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px}
h2{font-size:18px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
h4{font-size:12.5px;margin:0 0 6px;font-weight:700;color:var(--muted)}
.lamp{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--tick);box-shadow:inset 0 0 0 2px var(--slate)}
.lamp.st-open{background:transparent}
.lamp.st-na{background:var(--slate);box-shadow:none}.lamp.st-gk{background:var(--slate2);box-shadow:none}
.lamp.st-cb{background:var(--sky);box-shadow:none}.lamp.st-meet{background:var(--gold);box-shadow:none}
.lamp.st-later{background:var(--violet);box-shadow:none}.lamp.st-lost,.lamp.st-bad,.lamp.st-nr{background:var(--brick);box-shadow:none;opacity:.55}
.lt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.lt i{width:7px;height:7px;border-radius:50%;background:var(--slate)}
.lt.open i{background:var(--go)}.lt.soon i{background:var(--gold)}
.lt.open{color:var(--ink)}.lt:not(.open){color:var(--muted)}
.callb{display:inline-flex;align-items:center;gap:6px;background:var(--go);color:var(--go-ink);border:0;border-radius:999px;padding:6px 11px 6px 10px;font-weight:600;font-size:12.5px;white-space:nowrap;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.callb:hover{filter:brightness(1.07);background:var(--go)}
.callb svg{width:13px;height:13px;fill:currentColor}
.callb.alt{background:var(--go-soft);color:var(--go)}
.nophone{font-size:12px;color:var(--muted)}
.c-call{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:nowrap}
@media (max-width:640px){.lbar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-right:-22px;padding-right:22px}.lbar .chips::-webkit-scrollbar{display:none}.lbar .chips .chip{flex:none}.lbar .chips .sep{flex:none}}
.callb svg{flex:none}.c-call .callb{flex:0 1 auto;min-width:0}
.iconb{width:28px;height:28px;padding:0;border-radius:999px;font-size:13px;line-height:1;display:inline-grid;place-items:center;flex:none}
.scb{padding:5px 10px}.scb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel.solo{display:block}.panel.solo .cs{border-top:0;margin-top:0;padding-top:0}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:12.5px;background:var(--sheet);white-space:nowrap;font-weight:500}
.chip .c{color:var(--muted);font-weight:500}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on .c{color:inherit;opacity:.7}
.chip.tog.on{background:var(--go-soft);color:var(--go);border-color:transparent}
.chip.warn{border-color:var(--brick);color:var(--brick)}
.toast-wrap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;pointer-events:auto;max-width:min(560px,92vw)}
.toast button{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.35)}

/* leads bar */
.lbar{display:flex;flex-direction:column;gap:10px}
.lbar .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbar input[type=search]{flex:1 1 260px;min-width:200px;padding:9px 12px;font-size:14px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.16);padding:6px;min-width:250px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-weight:500}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:5px 4px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 10px;margin-top:10px}
.bulk select,.bulk button{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}
.bulk select option{color:#172231;background:#fff}
.bulk b{margin-right:4px}

/* lead rows */
.list{margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.lhead,.row{display:grid;grid-template-columns:26px 14px minmax(150px,1.25fr) minmax(130px,1fr) 84px 270px 150px 116px 28px;gap:0 10px;align-items:center;padding:9px 12px}
.lhead{font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule);background:var(--hover)}
.row{border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.exp{background:var(--hover)}
.row.stale{opacity:.5}
.row .nm{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.row .nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.row .nm .t:hover{text-decoration:underline}
.row .s2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .co{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{border:0;background:transparent;padding:0 2px;font-size:14px;line-height:1;color:var(--tick)}
.star.on{color:var(--gold)}
.star:hover{background:transparent;color:var(--gold)}
.row select.stsel{width:100%;padding:6px 7px;font-size:12.5px}
.nextb{border:1px dashed var(--rule);background:transparent;padding:5px 8px;font-size:12.5px;border-radius:8px;width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextb.set{border-style:solid;background:var(--sheet)}
.nextb.due{border-color:var(--brick);color:var(--brick);font-weight:600}
.chev{border:0;background:transparent;padding:4px;font-size:13px;color:var(--muted)}
.row input[type=checkbox],.lhead input[type=checkbox]{width:15px;height:15px;accent-color:var(--go)}
.more{display:flex;justify-content:center;padding:12px}
.empty{padding:34px 18px;text-align:center}
.empty p{max-width:52ch;margin:6px auto 14px;color:var(--muted)}
@media (max-width:980px){
  .lhead{display:none}
  .row{grid-template-columns:24px 12px 1fr auto;grid-template-areas:"sel lamp who chev" ". . co lt" ". . call call" ". . st nx";gap:6px 8px}
  .row>.c-sel{grid-area:sel}.row>.c-lamp{grid-area:lamp}.row>.c-who{grid-area:who}.row>.c-co{grid-area:co}.row>.c-lt{grid-area:lt;justify-self:end;align-self:start}.row>.c-call{grid-area:call}
  .row>.c-st{grid-area:st}.row>.c-nx{grid-area:nx}.row>.chev{grid-area:chev}
  .row>.panel{grid-column:1/-1}
}

/* expanded panel */
.panel{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.15fr 1.25fr;gap:18px;margin:10px 0 4px 38px;padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
@media (max-width:980px){.panel{grid-template-columns:1fr;margin-left:0}}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:13px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;word-break:break-word}
.outs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.outs button{text-align:left;display:flex;align-items:center;gap:8px;padding:8px 10px}
.outs button i{width:5px;height:16px;border-radius:2px;flex:none}
.outs button kbd{margin-left:auto;font-family:inherit;font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:150px;overflow:auto}
.hist li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.hist li span{color:var(--muted);min-width:96px}
.script{background:var(--hover);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
details.fold{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
details.fold summary{cursor:pointer;font-weight:600;font-size:13px}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ef label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ef label.full{grid-column:1/-1}

/* popover */
.pop{position:absolute;z-index:70;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.18);padding:8px;width:250px}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:7px}
.pop button:hover{background:var(--soft)}
.pop .pk{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--rule);margin-top:4px}
.pop .pk input{flex:1;min-width:0}

/* today */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.daygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:860px){.daygrid{grid-template-columns:1fr}}
.daylist{list-style:none;margin:0;padding:0}
.daylist li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.daylist li:last-child{border-bottom:0}
.daylist .nm a{font-weight:600;color:var(--ink);text-decoration:none}
.daylist .nm a:hover{text-decoration:underline}
.startbtn{font-size:15px;padding:11px 18px;border-radius:12px;display:inline-flex;gap:9px;align-items:center}
